name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

# jobs:
#   test:
#     runs-on: ubuntu-latest

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-python's macOS builds install into /Users/runner, which doesn't exist on
      # a self-hosted Mac, so use the machine's own Python in a fresh virtualenv instead
      - name: Set up Python
        run: |
          python3 --version
          python3 -m venv .ci-venv
          echo "$PWD/.ci-venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q --cov=prediction_pipeline_demo --cov-report=term-missing --cov-fail-under=70

      - name: Run demo pipeline
        run: |
          python prediction_pipeline_demo.py
